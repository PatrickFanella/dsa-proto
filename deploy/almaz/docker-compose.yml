services:
  postgres:
    image: postgres:17
    container_name: dsa-proto-demo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dsa-proto-demo-private

  api:
    container_name: dsa-proto-demo-api
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      DEMO_READ_ONLY: ${DEMO_READ_ONLY:-true}
      ENABLE_ADMIN_INGEST: ${ENABLE_ADMIN_INGEST:-false}
      AUTO_REPLAY_FIXTURES: ${AUTO_REPLAY_FIXTURES:-false}
      REQUIRE_POSTGRES: ${REQUIRE_POSTGRES:-true}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    networks:
      - dsa-proto-demo
      - dsa-proto-demo-private

  web:
    container_name: dsa-proto-demo-web
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
        VITE_DEMO_READ_ONLY: "true"
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-18081}:80"
    networks:
      - dsa-proto-demo

  seed:
    container_name: dsa-proto-demo-seed
    profiles: ["seed"]
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command: ["node", "dist/fixtures-replay.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dsa-proto-demo-private

volumes:
  postgres-data:

networks:
  dsa-proto-demo:
    name: projects
    external: true
  dsa-proto-demo-private:
    name: dsa_proto_demo_private
