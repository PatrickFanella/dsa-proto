services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dsa_proto}
      POSTGRES_USER: ${POSTGRES_USER:-dsa_proto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dsa_proto} -d $${POSTGRES_DB:-dsa_proto}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dsa_proto}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-dsa_proto}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_DEMO_READ_ONLY: ${VITE_DEMO_READ_ONLY:-false}
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  postgres-data:
